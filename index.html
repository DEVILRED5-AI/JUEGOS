<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis Juegos">
<title>Mis Juegos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b10;
    --surface: #15151d;
    --line: rgba(255,255,255,0.08);
    --ink: #f4f2ec;
    --dim: #9b99a6;
    --gold: #ffcf5c;
    --orange: #ff8a3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { height: 100%; height: -webkit-fill-available; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  body {
    min-height: 100vh;
    min-height: 100lvh;
    overflow-x: hidden;
    transition: opacity .22s ease, transform .22s ease;
  }
  body.leaving { opacity: 0; transform: scale(.98); }

  /* ---------- Fondo ambiental ---------- */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: .32;
    pointer-events: none;
    z-index: 0;
  }
  .orb.a { width: 260px; height: 260px; background: var(--orange); top: -90px; right: -100px; animation: float 14s ease-in-out infinite; }
  .orb.b { width: 250px; height: 250px; background: #6a5cff; bottom: -100px; left: -110px; animation: float 18s ease-in-out infinite reverse; }
  @keyframes float { 50% { transform: translate(-24px, 30px); } }

  /* ---------- Splash ---------- */
  #splash {
    position: fixed;
    inset: 0;
    z-index: 50;
    background: radial-gradient(60% 40% at 50% 42%, rgba(255,120,60,.12), transparent 70%), #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    transition: opacity .55s ease, transform .55s cubic-bezier(.7,0,.3,1), visibility 0s .55s;
  }
  #splash.out { opacity: 0; transform: scale(1.06); visibility: hidden; }
  #splash.none { display: none; }

  .logo {
    position: relative;
    width: 92px;
    height: 92px;
    animation: pop .9s cubic-bezier(.2,.9,.3,1.25) both;
  }
  .logo::before, .logo::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 28px;
    border: 2px solid var(--gold);
    opacity: 0;
    animation: ring 2s ease-out .5s infinite;
  }
  .logo::after { animation-delay: 1.1s; }
  .logo-tile {
    width: 92px;
    height: 92px;
    border-radius: 28px;
    background: #000;
    border: 1.5px solid rgba(255,190,110,.35);
    display: grid;
    place-items: center;
    box-shadow: 0 0 46px -8px rgba(255,120,60,.6), inset 0 0 24px rgba(255,120,60,.12);
  }
  .logo svg {
    width: 62px;
    height: 52px;
    filter: drop-shadow(0 0 7px rgba(255,140,60,.75));
    animation: bolt .6s ease .7s both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.4) rotate(-12deg); } to { opacity: 1; transform: none; } }
  @keyframes ring { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }
  @keyframes bolt { from { opacity: 0; transform: scale(.5); } 60% { transform: scale(1.18); } to { opacity: 1; transform: scale(1); } }

  .splash-title {
    display: flex;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 34px;
    letter-spacing: -.01em;
  }
  .splash-title span {
    display: inline-block;
    opacity: 0;
    transform: translateY(16px);
    filter: blur(6px);
    animation: letter .6s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: calc(.9s + var(--d) * 55ms);
  }
  @keyframes letter { to { opacity: 1; transform: none; filter: none; } }
  .splash-sub {
    color: var(--dim);
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadein .8s ease 1.6s forwards;
  }
  @keyframes fadein { to { opacity: 1; } }
  .bar {
    position: absolute;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 56px);
    width: 120px;
    height: 3px;
    border-radius: 3px;
    background: rgba(255,255,255,.1);
    overflow: hidden;
  }
  .bar i {
    display: block;
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--gold), var(--orange));
    transform: translateX(-100%);
    animation: load 1.9s cubic-bezier(.6,0,.3,1) .4s forwards;
  }
  @keyframes load { to { transform: none; } }

  /* ---------- App ---------- */
  .app {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 18px calc(env(safe-area-inset-bottom, 0px) + 32px);
  }
  .fade, .card { opacity: 0; transform: translateY(18px); }
  .ready .fade, .ready .card {
    animation: rise .65s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: calc(var(--i, 0) * 90ms + 80ms);
  }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 26px;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 17px; }
  .brand-tile {
    width: 38px; height: 38px; border-radius: 12px;
    background: #000;
    border: 1px solid rgba(255,190,110,.35);
    display: grid; place-items: center;
    box-shadow: 0 0 16px -4px rgba(255,120,60,.6);
  }
  .brand-tile svg { width: 26px; height: 22px; filter: drop-shadow(0 0 3px rgba(255,140,60,.7)); }
  .pill {
    font-size: 12px;
    color: var(--dim);
    border: 1px solid var(--line);
    background: rgba(255,255,255,.04);
    border-radius: 999px;
    padding: 6px 12px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(32px, 10vw, 42px);
    line-height: 1.08;
    letter-spacing: -.02em;
    margin: 0 0 8px;
  }
  h1 span { color: var(--gold); }
  .sub { color: var(--dim); font-size: 15px; margin: 0 0 26px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .card {
    --c1: var(--gold);
    --c2: var(--orange);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 200px;
    padding: 16px;
    border-radius: 24px;
    background: var(--surface);
    border: 1px solid var(--line);
    color: inherit;
    text-decoration: none;
    transition: transform .18s ease, border-color .18s ease;
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 80% at 0% 0%, var(--c1), transparent 60%);
    opacity: .16;
    pointer-events: none;
  }
  .card:active { transform: scale(.96) !important; border-color: var(--c1); }
  .icon {
    position: relative;
    width: 54px; height: 54px;
    border-radius: 17px;
    background: linear-gradient(145deg, var(--c1), var(--c2));
    display: grid; place-items: center;
    font-size: 28px;
    box-shadow: 0 10px 26px -10px var(--c1);
    margin-bottom: 14px;
  }
  .name {
    position: relative;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 18px;
    line-height: 1.15;
  }
  .desc {
    position: relative;
    color: var(--dim);
    font-size: 12.5px;
    line-height: 1.45;
    margin-top: 6px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .foot {
    position: relative;
    margin-top: auto;
    padding-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .tag { font-size: 11px; color: var(--c1); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 3px 9px; }
  .go {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255,255,255,.08);
    display: grid; place-items: center;
    font-size: 17px; line-height: 1;
  }

  .soon {
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 6px;
    background: transparent;
    border: 1.5px dashed rgba(255,255,255,.16);
    color: var(--dim);
    pointer-events: none;
  }
  .soon::before { display: none; }
  .soon .plus { font-size: 30px; line-height: 1; opacity: .7; }
  .soon .t { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: var(--ink); opacity: .8; }
  .soon .s { font-size: 12px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-delay: 0ms !important;
      transition-duration: .01ms !important;
    }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="4" y1="20" x2="60" y2="54">
      <stop offset="0" stop-color="#ffd978"/>
      <stop offset=".55" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff4d8d"/>
    </linearGradient>
    <symbol id="gamepad" viewBox="0 10 64 54">
      <path d="M20 20H44C51 20 55 24 57 32L60 44C61.5 50 58 54 53 54C50 54 48 52.5 46 50L43.5 47C42.5 46 41.3 45.5 40 45.5H24C22.7 45.5 21.5 46 20.5 47L18 50C16 52.5 14 54 11 54C6 54 2.5 50 4 44L7 32C9 24 13 20 20 20Z"
            fill="none" stroke="url(#neon)" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="14" y="30" width="12" height="5" rx="1.2" fill="url(#neon)"/>
      <rect x="17.5" y="26.5" width="5" height="12" rx="1.2" fill="url(#neon)"/>
      <circle cx="47" cy="28.5" r="2.2" fill="url(#neon)"/>
      <circle cx="47" cy="36.5" r="2.2" fill="url(#neon)"/>
      <circle cx="43" cy="32.5" r="2.2" fill="url(#neon)"/>
      <circle cx="51" cy="32.5" r="2.2" fill="url(#neon)"/>
    </symbol>
  </defs>
</svg>
<div class="orb a"></div>
<div class="orb b"></div>

<div id="splash">
  <div class="logo">
    <div class="logo-tile">
      <svg viewBox="0 0 64 54"><use href="#gamepad" width="64" height="54"/></svg>
    </div>
  </div>
  <div class="splash-title" id="splash-title" aria-label="Mis Juegos"></div>
  <div class="splash-sub">Tu colección de juegos</div>
  <div class="bar"><i></i></div>
</div>

<div class="app" id="app">
  <div class="topbar fade" style="--i:0">
    <div class="brand">
      <div class="brand-tile"><svg viewBox="0 0 64 54"><use href="#gamepad" width="64" height="54"/></svg></div>
      Mis Juegos
    </div>
    <div class="pill" id="contador"></div>
  </div>

  <h1 class="fade" style="--i:1">¿A qué <span>jugamos</span> hoy?</h1>
  <p class="sub fade" style="--i:2">Elige un juego y empieza a jugar.</p>

  <div class="grid" id="lista"></div>
</div>

<script>
// ➜ Para agregar un juego nuevo: crea su carpeta con su index.html
//    y añade UNA línea aquí. Los colores (c1, c2) son opcionales.
const JUEGOS = [
  { nombre: 'Duelo Relámpago', desc: 'Reflejos para dos en el mismo celular. ¡Toca primero cuando se ilumine!', ruta: 'duelo-relampago/', emoji: '⚡', tag: '2 jugadores', c1: '#ffcf5c', c2: '#ff8a3d' },
  // { nombre: 'Otro juego', desc: 'Descripción corta.', ruta: 'otro-juego/', emoji: '🎮', tag: '1 jugador', c1: '#00d9c0', c2: '#2b8cff' },
];

/* ---------- Bloqueo de zoom (también para iOS) ---------- */
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) {
  document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
});
document.addEventListener('touchmove', function (e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
var ultimoToque = 0;
document.addEventListener('touchend', function (e) {
  var ahora = Date.now();
  if (ahora - ultimoToque <= 300) e.preventDefault();
  ultimoToque = ahora;
}, { passive: false });
document.addEventListener('wheel', function (e) {
  if (e.ctrlKey) e.preventDefault();
}, { passive: false });

/* ---------- Tarjetas ---------- */
var lista = document.getElementById('lista');
JUEGOS.forEach(function (j, i) {
  var a = document.createElement('a');
  a.className = 'card';
  a.href = j.ruta;
  a.style.setProperty('--i', i + 3);
  if (j.c1) a.style.setProperty('--c1', j.c1);
  if (j.c2) a.style.setProperty('--c2', j.c2);

  var icon = document.createElement('div');
  icon.className = 'icon';
  icon.textContent = j.emoji;

  var n = document.createElement('div');
  n.className = 'name';
  n.textContent = j.nombre;

  var d = document.createElement('div');
  d.className = 'desc';
  d.textContent = j.desc;

  var foot = document.createElement('div');
  foot.className = 'foot';
  var tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = j.tag || '';
  var go = document.createElement('span');
  go.className = 'go';
  go.textContent = '›';
  foot.append(tag, go);

  a.append(icon, n, d, foot);

  a.addEventListener('click', function (e) {
    e.preventDefault();
    document.body.classList.add('leaving');
    setTimeout(function () { window.location.href = a.href; }, 200);
  });

  lista.append(a);
});

// Tarjeta "Próximamente"
var soon = document.createElement('div');
soon.className = 'card soon';
soon.style.setProperty('--i', JUEGOS.length + 3);
soon.innerHTML = '<div class="plus">＋</div><div class="t">Próximamente</div><div class="s">Más juegos en camino</div>';
lista.append(soon);

document.getElementById('contador').textContent =
  JUEGOS.length + (JUEGOS.length === 1 ? ' juego' : ' juegos');

// Al volver con "atrás" desde un juego, quitar el desvanecido
window.addEventListener('pageshow', function () {
  document.body.classList.remove('leaving');
});

/* ---------- Splash ---------- */
var splash = document.getElementById('splash');
var app = document.getElementById('app');

function mostrarApp() {
  app.classList.add('ready');
}

var yaVisto = false;
try { yaVisto = sessionStorage.getItem('splashVisto') === '1'; } catch (e) {}

if (yaVisto) {
  // Al volver desde un juego, entrar directo
  splash.classList.add('none');
  mostrarApp();
} else {
  var titulo = document.getElementById('splash-title');
  Array.from('Mis Juegos').forEach(function (ch, i) {
    var s = document.createElement('span');
    s.textContent = ch === ' ' ? '\u00A0' : ch;
    s.style.setProperty('--d', i);
    titulo.append(s);
  });

  var reducido = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function () {
    splash.classList.add('out');
    mostrarApp();
    try { sessionStorage.setItem('splashVisto', '1'); } catch (e) {}
  }, reducido ? 500 : 2600);
}

/* ---------- Pantalla completa (oculta las barras del sistema) ---------- */
function entrarPantallaCompleta() {
  var el = document.documentElement;
  if (document.fullscreenElement || !el.requestFullscreen) return;
  try {
    var p = el.requestFullscreen({ navigationUI: 'hide' });
    if (p && p.catch) p.catch(function () {});
  } catch (e) {}
}
// Al primer toque (menos en las tarjetas, que cambian de página)
document.addEventListener('click', function (e) {
  if (e.target.closest && e.target.closest('.card')) return;
  entrarPantallaCompleta();
});

/* ---------- Instalación como app (funciona sin internet) ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
